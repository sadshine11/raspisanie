name: Raspisanie

options:
  bundleIdPrefix: ru.eleqq
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
  developmentLanguage: ru
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1"          # только iPhone
    SWIFT_TREAT_WARNINGS_AS_ERRORS: NO
    ENABLE_USER_SCRIPT_SANDBOXING: NO

targets:

  Raspisanie:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Resources
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ru.eleqq.raspisanie
        PRODUCT_NAME: Raspisanie
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        DEVELOPMENT_TEAM: ""
        CODE_SIGN_IDENTITY: ""
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGNING_ALLOWED: NO
    info:
      path: Support/Info.plist
      properties:
        CFBundleDisplayName: Расписание
        CFBundleName: Расписание
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        CFBundleDevelopmentRegion: ru
        CFBundleLocalizations: [ru]
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIRequiresFullScreen: false
        ITSAppUsesNonExemptEncryption: false
        # Сайт расписания работает по обычному HTTP на IP-адресе с портом 7085,
        # поэтому строгую политику App Transport Security приходится ослабить.
        # Приложение ставится по сертификату и не проходит проверку App Store,
        # так что ограничение здесь ни на что не влияет.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true

  RaspisanieTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
        excludes:
          - "Fixtures/**"
      - path: Tests/Fixtures
        buildPhase: resources
    dependencies:
      - target: Raspisanie
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ru.eleqq.raspisanie.tests
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGNING_ALLOWED: NO

schemes:
  Raspisanie:
    build:
      targets:
        Raspisanie: all
        RaspisanieTests: [test]
    test:
      targets:
        - RaspisanieTests
      gatherCoverageData: false
    run:
      config: Debug
    archive:
      config: Release
